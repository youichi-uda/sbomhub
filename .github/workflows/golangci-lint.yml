# SBOMHub - golangci-lint
#
# Trust Rescue P1 #17-followup / docs/ci-inventory.md §4 Action items.
#
# Companion to go-test.yml. While go-test runs `go build` + `go test`, this
# workflow runs the static-analysis quality gate (`golangci-lint run`)
# against apps/api per the linter set declared in apps/api/.golangci.yml.
#
# M46 Track C-3c: lint is a HARD GATE (continue-on-error removed).
#
# History, corrected to what actually happened: the job landed with
# `continue-on-error: true` pinned to golangci-lint v1.62 as a
# "warning mode" first pass. In reality it never linted anything —
# every official v1 binary is built with go <= 1.24 and hard-errors on
# apps/api's go.mod directive ("the Go language version (go1.23) used
# to build golangci-lint is lower than the targeted Go version (1.26)",
# exit 3; measured 2026-07-25 with v1.62 and with the final v1 release
# v1.64.8). continue-on-error then swallowed that config error, so the
# green checkmark was a no-op, not a lint pass. The M46 waves cleaned
# the backlog (277 → 0 issues) against golangci-lint v2 and the config
# was migrated to the v2 schema, so the gate is now real and strict.
#
# version is PINNED (not `latest`) for reproducibility: a floating
# `latest` can flip the gate red on unrelated PRs when a new golangci
# release adds/changes checks. Bump deliberately, together with any new
# findings it surfaces. v2.12.2 = latest stable at pin time and the
# exact binary the config was verified against (0 issues, 2026-07-26).
# Same pin + rationale as sbomhub-cli/.github/workflows/ci.yml `lint`.

name: golangci-lint

# TRIGGERS: deliberately NOT path-filtered on pull_request.
#
#   docs/ci-inventory.md §2.3 lists `golangci-lint / lint` as a Required
#   status check. A path-filtered workflow does not START on a PR that
#   misses the filter, and GitHub never synthesises a result for a check
#   that never ran — the required check sits Pending forever and the PR
#   cannot merge. (Documented behaviour:
#   docs.github.com/en/pull-requests/.../troubleshooting-required-status-checks)
#   So the workflow runs for every PR and the *work* is gated per-step
#   instead (the "Probe whether apps/api changed" step below sets
#   `relevant`, and the Go steps skip when it is false — the job still
#   completes green, which is what a required check needs). `push` keeps
#   its path filter: pushes are not gated on checks, so skipping is free
#   there.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/api/.golangci.yml"
      - ".github/workflows/golangci-lint.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the merge base to diff against for the relevance probe.
          fetch-depth: 0

      # Per-step gating (see the TRIGGERS note): the job always runs so the
      # required check always reports, but the expensive lint only executes
      # when Go-side files actually changed. `relevant=false` still ends in
      # a green check.
      - name: Probe whether apps/api changed
        id: probe
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `git diff --quiet` exit status, NOT a pipe into grep:
          #   * `grep -q` exits at the first match, so `git diff | grep -q`
          #     hands git a SIGPIPE on a large diff; under `pipefail` that
          #     turns the whole condition FALSE and the lint would be
          #     skipped while the required check still reports green.
          #   * `--no-renames` keeps a file moved OUT of apps/api visible
          #     as a deletion under the pathspec (rename detection would
          #     only show the destination).
          #   * three-dot: compare against the merge base, not the tip of
          #     the base branch.
          # exit 0 = no differences, 1 = differences, >1 = real error.
          set +e
          git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- \
            apps/api .github/workflows/golangci-lint.yml
          probe_status=$?
          set -e
          case "$probe_status" in
            0)
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              echo "No apps/api changes in this PR — lint is a no-op, check reports green."
              ;;
            1)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Never silently skip on a probe failure: fall back to linting.
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "::warning::relevance probe failed (git diff exit $probe_status) — linting anyway"
              ;;
          esac

      - name: Set up Go
        if: steps.probe.outputs.relevant != 'false'
        uses: actions/setup-go@v5
        with:
          # Pin to whatever apps/api/go.mod declares as the toolchain
          # directive. Mirrors go-test.yml — bump go.mod to bump CI.
          # F241 (M15 Phase D round 3 fix): removed the hard-coded
          # `go 1.24.11` reference that drifted after F235's 1.26 bump.
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Show versions
        if: steps.probe.outputs.relevant != 'false'
        run: |
          go version
          go env GOVERSION GOMOD GOFLAGS

      - name: golangci-lint
        if: steps.probe.outputs.relevant != 'false'
        # action v9 line is required for golangci-lint v2 binaries
        # (v6 predates the v2 CLI surface).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/api
