# SBOMHub - Quick Start Docker Compose
# Usage:
#   curl-only install path:
#     ./install.sh --start          # .env + roles + up を一気通貫
#   git-clone install path:
#     ./install.sh                  # .env だけ生成
#     docker compose up -d --wait postgres
#     ./install.sh --bootstrap-roles
#     docker compose up -d
# Open: http://localhost:3000
#
# Roles (P0 #2 / Trust Rescue 9.1.1):
#   - sbomhub          : POSTGRES_USER, db owner (superuser-equivalent inside
#                        this DB). Used only to bootstrap the two roles below.
#   - sbomhub_migrator : Runs migrations / DDL. CREATEDB + CREATEROLE, NOT
#                        BYPASSRLS. Used by MIGRATE_DATABASE_URL.
#   - sbomhub_app      : Runtime app role. SELECT/INSERT/UPDATE/DELETE only,
#                        NOBYPASSRLS so Row-Level Security is enforced. Used
#                        by DATABASE_URL.
#
# sbomhub_app / sbomhub_migrator は install.sh が docker compose exec 経由で
# psql に流して作成する (codex-r8: 旧 init.sh の bind mount は host file 依存で
# curl-only install では存在せず stack 全体を落とす罠だったため撤去)。
# fresh install / existing-volume upgrade のどちらも install.sh が role bootstrap
# の single source of truth。
#
# Override passwords by creating a .env file at the repo root (see .env.example).

services:
  api:
    image: y1uda/sbomhub-api:latest
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # codex-r16: operator が .env で DATABASE_URL / MIGRATE_DATABASE_URL を
      # 完全形で override できるように `${VAR:-default}` 形式にする。 password
      # に URL 区切り文字 (@ : / # ? & 等) を含む production password を使う
      # 場合は、 .env に URL-encoded password 込みの完全 URL を直接書くこと
      # (例: postgres://app:p%40ss@db.internal:5432/sbomhub?sslmode=require)。
      # install.sh が生成する default password は openssl rand -hex 16 で
      # URL-safe な hex のみなので、 fallback 経路は escape 不要。
      - DATABASE_URL=${DATABASE_URL:-postgres://sbomhub_app:${APP_PASSWORD:-sbomhub_app_dev}@postgres:5432/sbomhub?sslmode=disable}
      - MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL:-postgres://sbomhub_migrator:${MIGRATOR_PASSWORD:-sbomhub_migrator_dev}@postgres:5432/sbomhub?sslmode=disable}
      - REDIS_URL=redis://redis:6379
      # SECURITY (P0 #5 / Trust Rescue 9.2.1): no bundled default. The api will
      # refuse to start when this is unset, a known default, or shorter than 32
      # bytes. Generate one with: openssl rand -base64 32
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is not set. Copy .env.example to .env and generate one with openssl rand -base64 32}"
      - NVD_API_KEY=${NVD_API_KEY:-}
      # SECURITY (M48 FO-4): no `:-development` fallback. Supplying one here
      # would launder an unset APP_ENV into the weakest posture the api has,
      # one level above the api's own refusal to start on an unset value —
      # which is the same fail-open the api-side guard exists to close. Same
      # `:?` shape as ENCRYPTION_KEY above.
      #
      # KNOWN, and true of every `${VAR}` in this block including
      # ENCRYPTION_KEY and DATABASE_URL: compose interpolates from the
      # invoking shell FIRST and .env second, so `export APP_ENV=development`
      # in the shell that runs `docker compose up` wins over the .env this
      # repository ships. That is standard compose precedence rather than
      # something introduced here, and it takes a deliberate export — but it
      # does silently relax the guards, so the startup log prints the value it
      # actually resolved (`APP_ENV check passed app_env=...`). Check it after
      # a deploy.
      # The legacy ENVIRONMENT variable is the documented fallback (config.go
      # reads it when APP_ENV is absent), so this has to accept either one.
      #
      # NOTE the shape. An earlier attempt at this wrote
      # `${APP_ENV:-${ENVIRONMENT:?...}}` to keep a compose-time assertion, and
      # that is WRONG: compose evaluates the inner `:?` eagerly, so
      # `APP_ENV=production` with ENVIRONMENT unset — the normal configuration,
      # and the one .env.example ships — failed with "required variable
      # ENVIRONMENT is missing a value". Codex round 5 caught it; my own check
      # had only covered ENVIRONMENT-only and neither-set.
      #
      # So: plain fallback, no assertion here. Passing an empty value through is
      # safe because config.ValidateEnvironment refuses it at startup with a
      # message naming both variables. The container starts and exits rather
      # than failing at `docker compose config`, which is a worse error surface
      # but a correct one — and it is the only shape that does not break the
      # primary configuration.
      - "APP_ENV=${APP_ENV:-${ENVIRONMENT:-}}"
      # SECURITY (M48 FO-3): REQUIRED declaration, clerk | anonymous. The api
      # refuses to start without it, in every environment, and refuses if it
      # disagrees with whether CLERK_SECRET_KEY arrived. Nothing is inferred:
      # a Clerk deployment whose secret injection fails entirely is otherwise
      # indistinguishable from a self-hosted one. .env.example ships
      # `anonymous`.
      - "SBOMHUB_AUTH_MODE=${SBOMHUB_AUTH_MODE:?SBOMHUB_AUTH_MODE is not set. UPGRADING? install.sh preserves your existing .env, so a pre-M48 .env will not have this line - add it by hand. Use anonymous for a self-host deployment (no user authentication - see docs/UPGRADE.md section 2b) or clerk when CLERK_SECRET_KEY is configured. There is deliberately no default: the mode used to be inferred from whether CLERK_SECRET_KEY arrived, and a Clerk deployment whose secret injection failed entirely was indistinguishable from a self-hosted one}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: y1uda/sbomhub-web:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=sbomhub
      - POSTGRES_PASSWORD=sbomhub
      - POSTGRES_DB=sbomhub
      - MIGRATOR_PASSWORD=${MIGRATOR_PASSWORD:-sbomhub_migrator_dev}
      - APP_PASSWORD=${APP_PASSWORD:-sbomhub_app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbomhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
