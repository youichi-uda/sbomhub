# SBOMHub SBOM Upload Workflow
# This workflow generates an SBOM and uploads it to SBOMHub

name: SBOM Upload

on:
  workflow_dispatch:
    # `scan` is a RE-scan, and it is off by default. Uploading an SBOM already
    # runs a tracked NVD/JVN scan server-side (SbomHandler.startBackgroundScan),
    # so leaving this off does NOT mean "no vulnerability scan" — it means "do
    # not sweep the same SBOM a second time". See the long comment on the step
    # itself for the measurement. The description says so, because the previous
    # one ('Run vulnerability scan after upload') read as if switching it off
    # disabled scanning, which was never true.
    inputs:
      scan:
        description: 'Re-scan the uploaded SBOM (the upload already scans it once)'
        required: false
        default: false
        type: boolean

env:
  SBOMHUB_URL: ${{ vars.SBOMHUB_URL || 'http://localhost:8080' }}
  PROJECT_ID: ${{ vars.SBOMHUB_PROJECT_ID }}

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json=sbom.json

      # The key travels in `Authorization: Bearer`, not `X-API-Key`.
      #
      # Both are accepted by the API (middleware.apiKeyCredential reads either,
      # X-API-Key first), so this is not a compatibility fix — it is about what
      # each header does on a REDIRECT.
      #
      # Measured with curl 8.18.0 against a throwaway server that 302s across
      # origins (2026-08-04):
      #
      #   curl -L  ...  origin A: Authorization SENT   X-API-Key SENT
      #                 origin B: Authorization STRIPPED, X-API-Key SENT
      #
      # curl drops Authorization when a redirect changes host/port/scheme and
      # keeps custom headers, because it has no way to know a custom header is a
      # credential. The calls below carry no -L, so as written the redirect is
      # never followed at all (measured: num_redirects=0, the 3xx is returned as
      # is) and nothing leaks — the change is for the copy of this file that
      # someone adds -L to when their deployment lands behind a redirecting
      # proxy, which is a one-character edit away from mailing the key to
      # whatever host the proxy names.
      #
      # Cost of the switch, stated: the Authorization channel requires the
      # `sbh_` prefix that service.APIKeyService.generateAPIKey always emits,
      # while X-API-Key accepts any value. A key hand-inserted into the database
      # without that prefix would stop working here.
      - name: Upload SBOM to SBOMHub
        env:
          SBOMHUB_API_KEY: ${{ secrets.SBOMHUB_API_KEY }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "Error: SBOMHUB_PROJECT_ID is not set"
            exit 1
          fi

          if [ -z "$SBOMHUB_API_KEY" ]; then
            echo "Error: SBOMHUB_API_KEY secret is not set"
            exit 1
          fi

          curl -X POST \
            "${SBOMHUB_URL}/api/v1/projects/${PROJECT_ID}/sbom" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SBOMHUB_API_KEY}" \
            -d @sbom.json \
            --fail-with-body

          echo "SBOM uploaded successfully!"

      # `continue-on-error: true` was REMOVED from this step on 2026-08-05.
      #
      # What it was hiding, measured on a throwaway stack 2026-08-04/05 with one
      # tenant-level sbh_ key, on both header spellings:
      #
      #   POST /api/v1/projects/<id>/sbom              201
      #   GET  /api/v1/projects/<id>/sbom              200
      #   POST /api/v1/projects/<id>/scan?sbom_id=...  404   <- resolved as the
      #                                                         DEFAULT tenant,
      #                                                         which does not own
      #                                                         the project
      #
      # 401 under Clerk. POST /api/v1/projects/:id/scan was registered on the
      # Clerk-only `authWrite` group, so no API key was ever consulted for it,
      # and `continue-on-error: true` meant no run ever went red over it. The
      # route moved onto the MultiAuth chain (cmd/server/main.go, M53 W1) and is
      # classified in middleware/project_scope.go, so it now answers 202 for a
      # tenant-level key and for a project-scoped key naming its OWN project (403
      # for any other project id, which is a real error and should be red here).
      #
      # WHAT WAS *NOT* BROKEN — corrected here after Codex review, because the
      # first draft of this comment said "every run uploaded an SBOM that was
      # never scanned" and that is FALSE. POST /api/v1/projects/:id/sbom starts
      # its own tracked NVD/JVN scan on ingest (SbomHandler.startBackgroundScan)
      # and always has. Measured on a throwaway stack 2026-08-05: uploading the
      # fixture and making NO /scan call left one component_vulnerabilities row
      # and GET /sboms/<id>/scan-status reporting
      # `{"status":"completed", ... "critical":1}`. The SBOMs were scanned. What
      # never worked is this explicit RE-scan trigger.
      #
      # WHICH IS WHY THE `scan` INPUT NOW DEFAULTS TO FALSE. With the route
      # reachable, running this step on a freshly uploaded SBOM sweeps it a
      # SECOND time, and the second sweep is untracked: measured on the same
      # stack, NVD was absorbed by its Redis cache (`cache_hits=1, api_calls=0`)
      # but JVN issued a fresh outbound request (it has no cache), the
      # component_vulnerabilities count did not change, and scan-status did not
      # move — because this route has no ScanTracker. Fixing a silent failure is
      # not a licence to add duplicated outbound traffic to every dispatch, so
      # the default keeps a plain run byte-for-byte what it was, and the input
      # (declared at the top of this file since the beginning and read by
      # NOTHING until now) finally means what it says.
      #
      # WHEN TO SWITCH IT ON: to re-run the sweep against refreshed NVD/JVN data
      # without re-uploading, or to scan with a narrower `sources` list.
      #
      # WHAT THIS STEP CAN AND CANNOT DETECT. The endpoint is a TRIGGER: it
      # answers 202 Accepted and runs the sweep in a background goroutine, with
      # no tracker for this route (see VulnerabilityHandler.runScan's doc
      # comment). So a red step here means "the re-scan was not started"; a green
      # step does NOT mean it finished, or found anything, or that its
      # transaction committed. To gate a build on scan RESULTS use the CLI —
      # `sbomhub scan . --project <name> --fail-on critical` polls
      # /sboms/:sbom_id/scan-status and blocks on the counts.
      #
      # KNOWN, and the reason this step is last: the upload above is
      # irreversible, so a failure here reds a job whose SBOM is already stored
      # AND already scanned. That is deliberate — an operator who explicitly
      # asked for a re-scan should be told it was refused — but re-dispatching
      # the workflow will upload the SBOM again. The rate limit is shared with
      # the upload (both on the 60/min standard budget per API key), so a key
      # near its ceiling can fail here for reasons that have nothing to do with
      # this step.
      - name: Trigger Vulnerability Scan
        if: ${{ inputs.scan }}
        env:
          SBOMHUB_API_KEY: ${{ secrets.SBOMHUB_API_KEY }}
        run: |
          set -euo pipefail

          # Get latest SBOM ID. --fail-with-body so an auth/permission failure
          # here is the step's failure and not an empty SBOM_ID two lines later:
          # the previous version treated "no id in the response" as "nothing to
          # do" and exited 0, which is the same silence continue-on-error gave.
          SBOM_RESPONSE=$(curl -sS --fail-with-body \
            "${SBOMHUB_URL}/api/v1/projects/${PROJECT_ID}/sbom" \
            -H "Authorization: Bearer ${SBOMHUB_API_KEY}")

          SBOM_ID=$(echo "$SBOM_RESPONSE" | jq -r '.id // empty')

          if [ -z "$SBOM_ID" ]; then
            echo "Error: could not read back the SBOM just uploaded (no .id in the response)"
            echo "$SBOM_RESPONSE"
            exit 1
          fi

          curl -sS --fail-with-body -X POST \
            "${SBOMHUB_URL}/api/v1/projects/${PROJECT_ID}/scan?sbom_id=${SBOM_ID}&sources=nvd,jvn" \
            -H "Authorization: Bearer ${SBOMHUB_API_KEY}"

          echo
          echo "Vulnerability scan triggered for sbom ${SBOM_ID} (accepted; it runs in the background)"
